[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Research-Pulse"
version = "0.1.0"
description = "A modular research-paper discovery and RAG application."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "httpx2>=2.13.1",
    "arxiv>=4.0.1",
    "ipykernel>=7.4.0",
    "httpx>=0.28.1",
    "pymupdf>=1.28.2",
    "docling>=2.139.0",
    "sqlalchemy>=2.1.5",
    "psycopg[binary]>=3.3.6",
    "dotenv>=0.9.9",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "email-validator>=2.3.0",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.17.0",
]
